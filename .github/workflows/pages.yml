# Deploys to GitHub Pages only what CI passed on main. Needs:
#   - Settings → Pages → Source: GitHub Actions
#   - the repository variable RELAY_URL: your relay Worker's URL, whose
#     ALLOWED_ORIGINS must include https://<owner>.github.io (docs/SELF-HOSTING.md)
# GitHub Pages cannot send headers: see docs/SECURITY.md for what that costs.
name: Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      RELAY_URL: ${{ vars.RELAY_URL }}
    steps:
      - name: Require the relay URL
        if: env.RELAY_URL == ''
        run: |
          echo "::error title=RELAY_URL is not set::Set the repository variable RELAY_URL (Settings → Secrets and variables → Actions → Variables) to your relay Worker's URL. See docs/SELF-HOSTING.md."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI tested, not whatever main is by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json # packageManager; Dockerfile.test copies the same release
      - run: bun install --frozen-lockfile
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build
        run: bun run build
        env:
          # '/<repository>' on <owner>.github.io, '' on a custom domain.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_RELAY_URL: ${{ env.RELAY_URL }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
