# Weekly: fails when PyPI has a newer yt-dlp (or the yt-dlp-ejs it pins) than
# src/lib/engine/wheels.ts. It opens no pull requests: run `bun run update:ytdlp`,
# the full test suite, and commit the new pins.
name: Check yt-dlp

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14 # the Bun in Dockerfile.test
      - run: bun scripts/update-ytdlp.ts --check
